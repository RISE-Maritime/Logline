name: build

# Runs the same three tasks the README documents for local use, so CI and a developer's machine
# agree on what "green" means.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties pins toolchainVersion=25. That file also carries foojay
      # download URLs, so Gradle can provision a JDK itself if the runner image lacks 25 — this step
      # just makes the common case fast and explicit.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 37 is leading-edge and will not be preinstalled on the runner image.
      #
      # **The package is `android-37.0`, not `android-37`** — from API 36 onwards Android publishes
      # minor releases, so the platform paths carry a minor version (36, 36.1, 37.0, 37.1) and the
      # bare `android-37` does not exist. `sdkmanager` answers a wrong path with
      # `Warning: Failed to find package` and exit 1, which reads like a runner or channel problem
      # rather than a typo; it had this workflow red on every run it ever made. Both the published
      # index and the SDK installed locally spell it `platforms;android-37.0`.
      - name: Install API 37 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No local.properties here — it is git-ignored, and AGP falls back to ANDROID_HOME, which
      # setup-android exports. Do not "helpfully" generate one.
      - name: Test, lint and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      # A red run that only says "task failed" wastes the round trip.
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
