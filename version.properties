# The app version, read by app/build.gradle.kts.
#
# Bumped by hand, deliberately: this is not a git repository, so there is no commit count or tag to
# derive from, and a version that changes as a side effect of building makes "is this the same build?"
# unanswerable. versionCode must be an integer and must increase for Android to treat a build as an
# upgrade.
versionCode=1
versionName=1.0
