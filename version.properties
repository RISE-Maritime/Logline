# The app version, read by app/build.gradle.kts.
#
# versionName is bumped by hand, deliberately: it is an editorial statement about what changed, not
# something a build should invent. CHANGELOG.md must carry a matching `## <versionName> — <date>`
# heading before a tag of that name will release — .github/workflows/release.yml fails without one.
#
# versionCode is NOT here. It is derived as versionCodeBase + `git rev-list --count HEAD`, so it is
# the same number on a laptop and in CI, always increases with history, and never has to be
# remembered. Two things about that are worth knowing before touching either number below.
#
# **A shallow clone fails the build rather than falling back.** `git rev-list --count HEAD` answers a
# truncated history with the clone depth — 1 under actions/checkout's default `fetch-depth: 1` — and
# it answers it *successfully*. That would ship versionCodeBase + 1 with nothing red anywhere, and an
# install at that code blocks every real upgrade afterwards until the phone is wiped. Every workflow
# that builds an APK sets `fetch-depth: 0` for this reason and no other.
#
# **versionCodeBase is a ratchet.** A squash, a filter-repo or a force-push can make the commit count
# go *down*, and Android will not install a lower versionCode over a higher one — a failure that is
# permanent per phone. This repository's history was rewritten once already, on 2026-09-11. So if it
# ever happens again, raise versionCodeBase until versionCodeBase + the new count clears the highest
# versionCode ever released, and never lower it. Starting at 10000 also keeps derived codes visibly
# distinct from the hand-written `versionCode=1` that shipped before this existed.
versionCodeBase=10000

# Used only where there is no git repository at all — a source archive with no history to count. It
# is deliberately low and warns: an APK numbered this way is not one anybody should be installing.
versionCodeFallback=1

versionName=1.1
