# The app version, read by app/build.gradle.kts.
#
# Bumped by hand, deliberately. There is a git repository now but no tags and no remote, so there is
# still nothing to derive from — and a version that changes as a side effect of building makes "is
# this the same build?" unanswerable, which is the real reason. versionCode must be an integer and must increase for Android to treat a build as an
# upgrade.
versionCode=1
versionName=1.0
